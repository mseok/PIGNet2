[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pignet2"
version = "2.0.0"
description = "Deep learning framework for protein-ligand binding affinity prediction"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "rdkit>=2022.09.5",
    "pandas>=1.2.0",
    "scipy>=1.6.0",
    "hydra-core>=1.1.0",
    "omegaconf>=2.1.0",
    "pymol-open-source-whl",
    "biopython>=1.78",
    "click>=8.0.0",
    "tqdm>=4.60.0",
    "numpy<2",
    "dimorphite-dl",
    "nodeenv>=1.6.0",
]

[project.optional-dependencies]
analysis = [
    "scikit-learn>=0.24.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
]
all = ["pignet2[analysis]"]

[project.urls]
Homepage = "https://github.com/yourusername/PIGNet2"
Documentation = "https://github.com/yourusername/PIGNet2#readme"
Repository = "https://github.com/yourusername/PIGNet2.git"
Issues = "https://github.com/yourusername/PIGNet2/issues"

[project.scripts]
pignet = "src.cli:cli"

[tool.setuptools]
packages = ["src", "src.models", "src.models.layers", "src.data", "src.analysis", "src.exe", "src.benchmark", "src.analyze", "src.keys"]
include-package-data = true

[tool.setuptools.package-data]
src = ["ckpt/*.pt", "config/**/*.yaml", "keys/**/*.txt"]
pignet2 = ["config/**/*.yaml"]

[tool.isort]
line_length = 88
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
